name: Build Etcher
on:
  push:
    branches: [allow-raid]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/make/
